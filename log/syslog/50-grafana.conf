# /etc/rsyslog.d/50-central-logging.conf

module(load="imfile")

*.* action(
    type="omfwd"
    target="<CENTRAL_LOGGING_SERVER_IP>"
    port="<PORT>"
    protocol="tcp"
    template="RSYSLOG_SyslogProtocol23Format"
    action.resumeRetryCount="-1"
    queue.type="LinkedList"
    queue.filename="central_log"
    queue.saveOnShutdown="on"
    queue.maxdiskspace="1g"
)

input(type="imfile"
    File="/var/log/snoopy.log"
    Tag="snoopy"
    Facility="local6"
    Severity="info")

input(type="imfile"
    File="/var/log/redbaronedr/detections.log"
    Tag="redbaronedr"
    Facility="local6"
    Severity="info")
